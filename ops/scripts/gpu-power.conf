# GPU 功耗墙逐卡配置 (gpu-power.sh 读取, lytv 可直接编辑, 改完下次 cron 触发即生效)
# 格式: GPU序号  day(W)  quiet(W)  night(W)   —— 空行和 # 开头忽略, 序号必须 0-7
# 策略基线: 工作日白天(day)全卡静音档; quiet=手动更静档; night/周末/节假日=满血 450W
# 风扇是温控曲线(GeForce 无法软件直控): 限功→降温→风扇自动降, 这就是"限风扇"的实现方式
#
# —— llama.cpp 生产 (常驻解码, 持续负载是主要噪音源, 250W = -17% 速度换大幅静音) ——
0  250  200  450
1  250  200  450
# —— ComfyUI/H3 (实测 20s 级突发 444W 风扇不升速; 但白天长批量会响, 故工作日同样限 250;
#     若要白天满速出片且不介意风扇, 把下面两行 day 列改成 450) ——
2  250  200  450
3  250  200  450
# —— 空闲/未来负载 (闲置时限功零影响; 未来上训练/新服务, 工作日白天自动静音;
#     如需白天满速(如赶训练)把 day 列改 450) ——
4  250  200  450
5  250  200  450
6  250  200  450
7  250  200  450

# Qwen3.8-27B GGUF (iq4_xs+MTP) —— llama.cpp 推理服务(4副本) + OpenResty 动态LB + 可选网页聊天
#
# 起全部4副本:        docker compose up -d
# 加网页聊天界面:      sudo ufw allow 3000/tcp && docker compose --profile ui up -d
#                     浏览器开 http://<LAN-IP>:3000
# 看日志:             docker logs -f qwen27b
# 停止:               docker compose down
#
# 架构: 客户端 → OpenResty(Lua):8000 → 4×llama-server (每副本1张卡, GPU0-3; GPU4-7预留)
#   动态路由(lb/route.lua): 会话粘滞优先(前缀缓存命中), 目标副本4slot满载时漂到最闲副本,
#   新会话接入最闲副本, 副本不健康自动摘除, 会话映射TTL 30分钟
#   单副本: 4 slot × 256K, ~100-113 tok/s(MTP); 4副本 = 16 slot 并发上限(超出排队)
x-llama-base:
  &llama-base
  image: llama-server:cuda12.4-b10715   # 2026-08-31 升级(源码 /data/build/llama.cpp-new); 旧版镜像 cuda12.4-local 保留可回滚
  pull_policy: never
  restart: unless-stopped
  volumes:
    - /data/models:/models
  command: >
    -m /models/Qwen3.8-27B-Heretic-Ara-iq4_xs-3.0-mtp.gguf
    --host 0.0.0.0
    --port 8080
    -c 262144
    -ngl 999
    --cache-type-k q4_0
    --cache-type-v q4_0
    --spec-draft-type-k q8_0
    --spec-draft-type-v q8_0
    -fa on
    --cache-reuse 2048
    --jinja
    -a qwen3.8-27b
    --metrics
    --spec-type draft-mtp
  # 2026-08-29 终配: 256K 上下文 + MTP + KV q4_0, 单副本显存 23.9G/24.5G(97%)
  #   生成 ~100-113 tok/s, 200K 针测试通过(q4 无损), 前缀缓存复用 2048
  # 2026-08-30 横向扩容LB; 2026-08-31 缩4副本+OpenResty动态路由
  # 历史配置: .bak-20260829(256K无MTP) | .bak-20260829-mtp128k(128K+MTP+q8) | .bak-20260829-pre-lb(单副本)
  # 加 API 密钥: 在上面 command 末尾补一行 --api-key 你的密钥

services:

  llama:
    <<: *llama-base
    container_name: qwen27b
    gpus:
      - driver: nvidia
        device_ids: ['0']
    ports:
      - "127.0.0.1:8081:8080"    # 只走本机 nginx, 不直接对外
    command: >
      -m /models/Qwen3.8-27B-Heretic-Ara-iq4_xs-3.0-mtp.gguf
      --host 0.0.0.0
      --port 8080
      -c 262144
      -np 2
      -ngl 999
      --cache-type-k q4_0
      --cache-type-v q4_0
      --spec-draft-type-k q8_0
      --spec-draft-type-v q8_0
      -fa on
      --cache-reuse 2048
      --jinja
      -a qwen3.8-27b
      --metrics
      --spec-type draft-mtp

  r1:
    <<: *llama-base
    container_name: qwen27b-r1
    gpus:
      - driver: nvidia
        device_ids: ['1']
    ports:
      - "127.0.0.1:8082:8080"
    command: >
      -m /models/Qwen3.8-27B-Heretic-Ara-iq4_xs-3.0-mtp.gguf
      --host 0.0.0.0
      --port 8080
      -c 262144
      -np 2
      -ngl 999
      --cache-type-k q4_0
      --cache-type-v q4_0
      --spec-draft-type-k q8_0
      --spec-draft-type-v q8_0
      -fa on
      --cache-reuse 2048
      --jinja
      -a qwen3.8-27b
      --metrics
      --spec-type draft-mtp

  # —— 大会话池副本(r2/r3): 单 slot 独享 256K, 无驱逐, 大上下文会话每轮增量 prefill ——
  # (共享池多 slot 模式下, 大会话的 KV 驻留最易被 LRU 驱逐 → 每轮全量重 prefill 的死结)
  r2:
    <<: *llama-base
    container_name: qwen27b-r2
    gpus:
      - driver: nvidia
        device_ids: ['2']
    ports:
      - "127.0.0.1:8083:8080"
    command: >
      -m /models/Qwen3.8-27B-Heretic-Ara-iq4_xs-3.0-mtp.gguf
      --host 0.0.0.0
      --port 8080
      -c 262144
      -np 1
      -ngl 999
      --cache-type-k q4_0
      --cache-type-v q4_0
      --spec-draft-type-k q8_0
      --spec-draft-type-v q8_0
      -fa on
      --cache-reuse 2048
      --jinja
      -a qwen3.8-27b
      --metrics
      --spec-type draft-mtp

  r3:
    <<: *llama-base
    container_name: qwen27b-r3
    gpus:
      - driver: nvidia
        device_ids: ['3']
    ports:
      - "127.0.0.1:8084:8080"
    command: >
      -m /models/Qwen3.8-27B-Heretic-Ara-iq4_xs-3.0-mtp.gguf
      --host 0.0.0.0
      --port 8080
      -c 262144
      -np 1
      -ngl 999
      --cache-type-k q4_0
      --cache-type-v q4_0
      --spec-draft-type-k q8_0
      --spec-draft-type-v q8_0
      -fa on
      --cache-reuse 2048
      --jinja
      -a qwen3.8-27b
      --metrics
      --spec-type draft-mtp




  lb:
    image: docker.m.daocloud.io/openresty/openresty:1.25.3.2-alpine
    container_name: qwen27b-lb
    restart: unless-stopped
    depends_on:
      - llama
      - r1
      - r2
      - r3
    volumes:
      - ./lb/qwen27b.conf:/etc/nginx/conf.d/qwen27b.conf:ro
      - ./lb:/etc/nginx/lb:ro
    ports:
      - "8000:8000"                     # 唯一对外入口(ufw 已放行)

  # —— 可选: GPU 监控页(默认不启动): docker compose --profile mon up -d → :9000 ——
  mon:
    image: docker.m.daocloud.io/library/python:3.12-slim   # glibc(nvidia-smi 需要) + 自带 http.server
    container_name: qwen27b-mon
    restart: unless-stopped
    profiles: ["mon"]
    gpus:
      - driver: nvidia
        count: all          # 只为读 nvidia-smi, 不占显存
    volumes:
      - ./mon:/app:ro
      - ./mon/hist:/www/hist     # 24h 历史落盘, 容器重建不丢
      - /proc:/host/proc:ro      # 读宿主 CPU/内存/负载 + GPU 进程的 cgroup/cmdline
      - /var/run/docker.sock:/var/run/docker.sock:ro   # 仅读: GPU 进程 pid → 容器名反查
    environment:
      - MON_SERVICES=${MON_SERVICES:-}   # 通用服务探活, 如 "ComfyUI=http://comfyui:8188/system_stats"
    command: python /app/collect.py
    ports:
      - "9000:8080"         # ufw 放行后浏览器开 http://<LAN-IP>:9000

  # —— 可选: 网页聊天界面(默认不启动, 见文件头命令) ——
  webui:
    image: ghcr.m.daocloud.io/open-webui/open-webui:main
    container_name: open-webui-qwen
    restart: unless-stopped
    profiles: ["ui"]
    depends_on:
      - llama
    volumes:
      - /data/open-webui:/app/backend/data
    environment:
      OPENAI_API_BASE_URL: http://llama:8080/v1
      OPENAI_API_KEY: sk-local
      ENABLE_OLLAMA_API: "false"
    ports:
      - "3000:8080"

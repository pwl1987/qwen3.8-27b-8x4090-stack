# Qwen3.8-27B 动态会话粘滞负载均衡 (OpenResty + Lua, 路由逻辑见 lb/route.lua)
# 会话粘滞保前缀缓存命中; 目标满载/不健康自动漂移最闲副本; 新会话接入最闲副本
lua_shared_dict sessions 32m;   # 会话key(512B)→副本, TTL 30min, ~3万会话容量
lua_shared_dict bstate   1m;    # 副本负载探测缓存, TTL 2s
lua_shared_dict lbstats   1m;   # 路由计数(粘滞/漂移/新会话/每副本选中), /_lbstats 读出
init_worker_by_lua_block { ngx.shared.lbstats:add("start_ts", ngx.time()) }

server {
    listen 8000;
    server_name _;

    client_max_body_size 512m;          # 长文档/base64 图片
    client_body_buffer_size 16m;        # 请求体驻内存, 供 Lua 取前缀(超大的落盘读文件)

    resolver 127.0.0.11 valid=10s ipv6=off;   # docker embedded DNS(变量式 proxy_pass 必需)

    # ==== ZxBench 评测平台 (2026-08-31, 容器名走 docker DNS) ====
    # 前端 (Vite dev, base=/zx/) 含 HMR WebSocket; 浏览器入口 http://<host>:8000/zx/
    location /zx/ {
        proxy_pass http://zxb-web:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
    # 对比报告静态目录 (~/zx-bench/reports)
    location /zx/reports/ {
        proxy_pass http://zxb-reports:3101/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_read_timeout 300s;
    }
    # ZxBench REST API
    location /api/ {
        proxy_pass http://zxb-server:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
    # ZxBench 实时进度 WebSocket
    location = /ws {
        proxy_pass http://zxb-server:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # 副本负载探测子请求(仅内部)
    location = /_probe {
        internal;
        proxy_pass http://$arg_b/slots;
        proxy_connect_timeout 1s;
        proxy_read_timeout 2s;
    }

    # 路由统计(2026-08-31 v3, 监控页 mon 容器采集; 仅本机+docker 网可访问)
    location = /_lbstats {
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        deny all;
        content_by_lua_block {
            local s = ngx.shared.lbstats
            local t = {start_ts = s:get("start_ts"),
                       sticky_hit = s:get("sticky_hit") or 0,
                       drift = s:get("drift") or 0,
                       new_sess = s:get("new_sess") or 0}
            for _, n in ipairs({"llama", "r1", "r2", "r3"}) do
                t["sel_" .. n] = s:get("sel_" .. n .. ":8080") or 0
            end
            ngx.header.content_type = "application/json"
            ngx.say(require("cjson.safe").encode(t))
        }
    }

    location / {
        set $backend "";
        access_by_lua_file /etc/nginx/lb/route.lua;
        proxy_pass http://$backend;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;       # 长生成/超长 prefill 不断流
        proxy_send_timeout 3600s;
        proxy_buffering off;            # SSE 流式直出
        proxy_cache off;
        chunked_transfer_encoding on;
    }
}
